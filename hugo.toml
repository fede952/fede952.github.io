baseURL = 'https://federicosella.com/'
buildFuture = true
locale = 'en-US'
title = 'Federico Sella'
theme = 'PaperMod'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true

# Fondamentale per evitare conflitti URL
[permalinks]
  posts = "/:year/:month/:title/"

# Taxonomies per categorizzazione contenuti
[taxonomies]
  category = "categories"
  tag = "tags"

# Related-content config: powers Hugo's `.Related` function used by
# partials/related-tools.html (tool -> tool cards, ranked by shared tags).
[related]
  threshold = 60
  toLower = true
  includeNewer = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

# Sitemap: layouts/_default/sitemap.xml lists only indexable pages.
[sitemap]
  filename = "sitemap.xml"

# Tag/category listings are thin pages: keep them for navigation but
# noindex them (PaperMod reads robotsNoIndex) and keep them out of the sitemap.
[[cascade]]
  [cascade.params]
    robotsNoIndex = true
  [cascade.target]
    kind = '{taxonomy,term}'

[params]
  mainSections = ["tools", "learn"]
  defaultTheme = "dark"
  # Dark-only platform (P4.2): every custom component (cards, accordions,
  # games, search palette) is designed on dark surfaces; light mode was
  # half-broken so the toggle is disabled rather than maintained.
  disableThemeToggle = true
  env = "production"
  title = "Federico Sella"
  description = "Free, privacy-first web utilities that run 100% in your browser — password security, image compression, QR codes and developer tools, plus practical guides and cheatsheets."
  keywords = ["free online tools", "web utilities", "privacy-first tools", "password generator", "image compressor", "qr code generator", "developer tools", "browser tools", "Federico Sella"]
  author = "Federico Sella"
  images = ["images/og-card.png"] # default share card, 1200x630 (scripts/og-card.mjs)
  ShowShareButtons = true

  # Home "Popular guides": hand-picked learn pages (resolved per language
  # via site.GetPage, so titles are localized). TODO(Federico): align this
  # list with what Umami shows as your most-read guides.
  # NOTE: must stay ABOVE the [params.*] sub-tables — TOML assigns any
  # key/value after a table header to that table.
  popular_guides = [
    "/learn/guides/osint-privacy-exif-data",
    "/learn/cheatsheets/networking-ports-protocols",
    "/learn/cheatsheets/nmap-network-scanning",
    "/learn/cheatsheets/git-disaster-recovery",
    "/learn/guides/steganography-101-hidden-messages",
    "/learn/cheatsheets/docker-container-commands",
  ]

  # Site owner, emitted as one schema.org Person (templates/schema_json.html)
  # and referenced as author/publisher of every page; also feeds the author
  # box on learn pages.
  [params.person]
    name = "Federico Sella"
    jobTitle = "Network Security Analyst"   # = About page and author box (L2 level described there)
    image = "images/profile.webp"
    sameAs = ["https://linkedin.com/in/federicosella", "https://github.com/fede952"]
    knowsAbout = ["Network security", "Security Service Edge (SSE)", "SASE", "Zero Trust", "Secure web gateway", "SOC operations", "Penetration testing"]

  # AdSense (config-driven units: partials/ads/unit.html). An empty
  # slot_<position> falls back to slot_default. Create one display unit per
  # position in AdSense → Ads → By ad unit and paste the numeric IDs here.
  # Placement (redesign Phase 3): tool pages tool_after + article_mid (before
  # the 3rd h2 of the long-form text), learn pages article_mid before the 2nd
  # and 5th h2, plus `sidebar` on desktop >= 1100 px; never two ads on one
  # screen (see REDESIGN_REPORT.md).
  [params.ads]
    client = "ca-pub-7359888124148067"
    slot_default = "5511096259"
    slot_tool_after = "9173467729"
    slot_article_mid = "2061972307"
    slot_sidebar = "9967674640"     # display unit, vertical/rectangle (300×250–300×600)
    # Not placed any more (the slot above the tool pushed it below the fold);
    # kept so the position can be reused: partial "ads/unit.html" (dict "position" "tool_top").
    slot_tool_top = ""

  # Affiliate partner blocks on tool pages (partials/affiliate/block.html),
  # placed after the "How it works" section. One partner per category; a
  # block renders only when both its name and url are set, so an empty
  # category shows nothing. Links get rel="sponsored noopener" and a
  # localized "Affiliate link" disclosure.
  [params.affiliate]
    password_manager_name = ""  # TODO Federico: partner name, e.g. the password manager you joined
    password_manager_url = ""   # TODO Federico: your affiliate URL
    # Pre-filled with the NordVPN link that was hard-coded in NetGuard and
    # Link Hazmat before the overhaul (moved here, unchanged).
    vpn_name = "NordVPN"
    vpn_url = "https://go.nordvpn.net/aff_c?offer_id=15&aff_id=140342&url_id=858"
    privacy_name = ""           # TODO Federico
    privacy_url = ""            # TODO Federico
    devsec_name = ""            # TODO Federico
    devsec_url = ""             # TODO Federico
    # Tool (content directory name) -> category
    [params.affiliate.tools]
      pass-fort = "password_manager"
      password-generator = "password_manager"
      netguard = "vpn"
      ghostprint = "vpn"
      link-hazmat = "vpn"
      exif-cleaner = "privacy"
      steganography = "privacy"
      secrets-scanner = "devsec"
      jwt-inspector = "devsec"

  [params.assets]
    # small-size raven mark (static/images/logo-mark.svg); the full logo stays for large uses
    favicon = "/favicon.svg"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    safari_pinned_tab = "/safari-pinned-tab.svg"
    # = --bg in assets/css/extended/tokens.css (browser UI colour, dark-only site)
    theme_color = "#0b0e12"
    msapplication_TileColor = "#0b0e12"

  [params.profileMode]
    enabled = false # P4.1: the homepage is a SaaS-style landing; the bio lives on /about/
    title = "Federico Sella"
    subtitle = "Network Security Analyst (L2) · SSE/SASE · Zero Trust · eJPT"
    imageUrl = "images/logo.webp"
    imageTitle = "Federico Sella"
    buttons = [
      { name = "About Me", url = "about/" },
      { name = "My Projects", url = "projects/" },
      { name = "Contact", url = "mailto:contact@federicosella.com" }
    ]
    
    [[params.socialIcons]]
      name = "linkedin"
      url = "https://linkedin.com/in/federicosella"
    [[params.socialIcons]]
      name = "github"
      url = "https://github.com/fede952"
    [params.label]
    text = "Federico Sella"
    icon = "images/logo-mark.svg" # header mark (our header partial renders its own; kept in sync)
    iconHeight = 35

