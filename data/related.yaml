# Internal-linking map, language-independent: every page is resolved with
# site.GetPage in the current language, so one entry links all 6 languages.
#
#   tools.<tool-slug>.tools   → "More free tools" cards on a tool page (topped up from .Related)
#   tools.<tool-slug>.guides  → "Related guides" on a tool page (paths under /learn/)
#   learn.<path>              → tools linked from a learn page (paths under /tools/)
#
# Rule of thumb: every tool links ≥2 guides, every learn page links ≥2 tools.
# Used by partials/sidebar.html (via partials/related-tool-pages.html).

