# Tool catalogue: category + icon for every tool (keyed by its content
# directory under content/tools/). Rendered by partials/icon.html as inline
# SVG: 24×24 viewBox, stroke only, 1.75 px round strokes, so all icons share
# one style. Paths are original (no icon library), so no licence applies.
#
# Categories are shown in this order on the home page and /tools/; labels
# are i18n keys cat_<id>.

# `top`: the 3 tools shown per category on the home page on phones (< 768 px);
# the rest sit behind "Show all N". Initial picks by search intent —
# TODO(Federico): re-rank from Umami. Without `top`, the first 3 by title.
categories:
  - id: security
    icon: shield
    top: [password-generator, pass-fort, exif-cleaner]
  - id: images
    icon: image
    top: [pdf-merge-split, qr-generator, heic-converter]
  - id: dev
    icon: code
    top: [json-formatter, text-diff, base64-converter]
  - id: productivity
    icon: bolt
    top: [freelance-calculator, zen-focus, string-master]

tools:
  pass-fort:            { category: security, icon: shield-check }
  password-generator:   { category: security, icon: key }
  netguard:             { category: security, icon: globe }
  security-headers:     { category: security, icon: shield-lines }
  phishing-quiz:        { category: security, icon: phish }
  ghostprint:           { category: security, icon: ghost }
  exif-cleaner:         { category: security, icon: image-x }
  link-hazmat:          { category: security, icon: link }
  secrets-scanner:      { category: security, icon: search-star }
  steganography:        { category: security, icon: layers }
  caesar-cipher:        { category: security, icon: dial }
  pixel-shrink:         { category: images, icon: minimize }
  qr-generator:         { category: images, icon: qr }
  glitch-forge:         { category: images, icon: bolt }
  neon-palette:         { category: images, icon: palette }
  heic-converter:       { category: images, icon: image-arrow }
  pdf-merge-split:      { category: images, icon: file-stack }
  images-to-pdf:        { category: images, icon: file-image }
  jwt-inspector:        { category: dev, icon: ticket }
  json-to-csharp:       { category: dev, icon: braces }
  base64-converter:     { category: dev, icon: swap }
  hash-generator:       { category: dev, icon: hash }
  chmod-calculator:     { category: dev, icon: terminal }
  easy-cron:            { category: dev, icon: calendar-clock }
  chrono-sync:          { category: dev, icon: clock }
  subnet-calculator:    { category: dev, icon: network }
  json-formatter:       { category: dev, icon: braces-check }
  text-diff:            { category: dev, icon: diff }
  freelance-calculator: { category: productivity, icon: calculator }
  zen-focus:            { category: productivity, icon: hourglass }
  string-master:        { category: productivity, icon: text }
  reflex-grid:          { category: productivity, icon: target }

# Icons for pages that are not tools
games: gamepad
learn:
  guides: book
  cheatsheets: list
  debug-sys: wrench
  interviews: chat
  roadmaps: route
  writeups: flag

