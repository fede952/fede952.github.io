<script src="/vendor/medium-zoom@1.1.0/medium-zoom.min.js"></script>
<script>
    // Click-to-zoom for images in articles, on the page background colour
    mediumZoom(document.querySelectorAll('.post-content img'), {
        margin: 24,
        background: getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0b0e12',
        scrollOffset: 0
    });
</script>

<!-- Iframe auto-resizer for embedded tools -->
<script src="{{ "js/iframe-resizer.js" | relURL }}"></script>

<!-- Command Palette Modal -->
<div id="search-modal" class="search-modal" role="dialog" aria-modal="true" aria-labelledby="search-modal-title" aria-hidden="true">
    <div class="search-backdrop"></div>
    <div class="search-dialog">
        <h2 id="search-modal-title" class="visually-hidden">{{ i18n "nav_search" }}</h2>
        <div class="search-input-wrap">
            {{ partial "icon.html" (dict "name" "search-star" "size" 20) }}
            <input id="search-input" type="search" placeholder="{{ i18n "hero_search_label" }}" aria-label="{{ i18n "hero_search_label" }}" autocomplete="off" spellcheck="false">
            <kbd class="search-esc">ESC</kbd>
        </div>
        <ul id="search-results" class="search-results" role="listbox" aria-label="{{ i18n "search_results" }}"></ul>
        <div id="search-empty" class="search-empty" style="display:none;">{{ i18n "search_empty" }}</div>
        <div class="search-footer">
            <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> {{ i18n "search_navigate" }}</span>
            <span><kbd>&crarr;</kbd> {{ i18n "search_open" }}</span>
            <span><kbd>Esc</kbd> {{ i18n "search_close" }}</span>
        </div>
    </div>
</div>

<!-- Fuse.js + Search Logic -->
<script src="/vendor/fuse.js@7.0.0/fuse.min.js"></script>
<script>
(function() {
    const modal = document.getElementById('search-modal');
    const input = document.getElementById('search-input');
    const resultsList = document.getElementById('search-results');
    const emptyState = document.getElementById('search-empty');
    const backdrop = modal.querySelector('.search-backdrop');
    const searchIndexURL = '{{ "index.json" | relLangURL }}';

    let fuse = null;
    let activeIndex = -1;
    let results = [];
    let previousFocus = null;

    // Lazy-load index on first open
    let indexPromise = null;
    function loadIndex() {
        if (!indexPromise) indexPromise = fetchIndex().then(search);
        return indexPromise;
    }
    async function fetchIndex() {
        try {
            const res = await fetch(searchIndexURL);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const contentType = res.headers.get('content-type') || '';
            if (!contentType.includes('json')) {
                throw new Error('Not JSON: ' + contentType);
            }
            const data = await res.json();
            if (!Array.isArray(data)) throw new Error('Index is not an array');
            fuse = new Fuse(data, {
                keys: [
                    { name: 'title', weight: 0.5 },
                    { name: 'section', weight: 0.2 },
                    { name: 'summary', weight: 0.3 }
                ],
                threshold: 0.4,
                minMatchCharLength: 2,
                includeScore: true
            });
        } catch(e) {
            console.error('Search index load failed:', e);
        }
    }

    function openModal() {
        loadIndex();
        previousFocus = document.activeElement;
        modal.setAttribute('aria-hidden', 'false');
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
        setTimeout(() => input.focus(), 50);
    }

    function closeModal() {
        modal.setAttribute('aria-hidden', 'true');
        modal.classList.remove('active');
        document.body.style.overflow = '';
        input.value = '';
        resultsList.innerHTML = '';
        emptyState.style.display = 'none';
        activeIndex = -1;
        results = [];
        if (previousFocus && typeof previousFocus.focus === 'function') {
            previousFocus.focus();
        }
        previousFocus = null;
    }

    function renderResults(hits) {
        results = hits.slice(0, 8);
        activeIndex = results.length > 0 ? 0 : -1;

        if (results.length === 0 && input.value.length >= 2) {
            resultsList.innerHTML = '';
            emptyState.style.display = 'block';
            return;
        }
        emptyState.style.display = 'none';

        resultsList.innerHTML = results.map((r, i) => {
            const item = r.item;
            const sectionLabel = item.section || 'Page';
            return `<li class="${i === 0 ? 'active' : ''}">
                <a href="${item.permalink}" class="search-result-link">
                    <span class="search-result-section">${sectionLabel}</span>
                    <span class="search-result-title">${item.title}</span>
                </a>
            </li>`;
        }).join('');
    }

    function updateActive() {
        const items = resultsList.querySelectorAll('li');
        items.forEach((li, i) => {
            li.classList.toggle('active', i === activeIndex);
        });
        if (items[activeIndex]) {
            items[activeIndex].scrollIntoView({ block: 'nearest' });
        }
    }

    // Every element marked data-search-trigger (the header search button,
    // the homepage hero search bar) opens the command palette.
    document.querySelectorAll('[data-search-trigger]').forEach(function (el) {
        el.addEventListener('click', openModal);
    });

    // Event: Backdrop click
    backdrop.addEventListener('click', closeModal);

    // Event: Keyboard
    document.addEventListener('keydown', function(e) {
        // Ctrl+K / Cmd+K
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            if (modal.classList.contains('active')) {
                closeModal();
            } else {
                openModal();
            }
            return;
        }

        if (!modal.classList.contains('active')) return;

        if (e.key === 'Escape') {
            closeModal();
            return;
        }

        // Focus trap: only one true focusable element (input). Result links are activated via Enter.
        if (e.key === 'Tab') {
            e.preventDefault();
            input.focus();
            return;
        }

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (results.length > 0) {
                activeIndex = (activeIndex + 1) % results.length;
                updateActive();
            }
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (results.length > 0) {
                activeIndex = (activeIndex - 1 + results.length) % results.length;
                updateActive();
            }
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (activeIndex >= 0 && results[activeIndex]) {
                window.location.href = results[activeIndex].item.permalink;
            }
        }
    });

    // Run the current query (also re-run once the index arrives, so text
    // typed while it was loading is not ignored).
    function search() {
        const query = input.value.trim();
        if (!fuse || query.length < 2) {
            resultsList.innerHTML = '';
            emptyState.style.display = 'none';
            results = [];
            activeIndex = -1;
            return;
        }
        const hits = fuse.search(query);
        renderResults(hits);
    }
    input.addEventListener('input', search);

    // Deep link: /<lang>/?q=term opens the palette with the query
    // (target of the WebSite SearchAction in templates/schema_json.html).
    const q = new URLSearchParams(window.location.search).get('q');
    if (q) {
        openModal();
        input.value = q;
        search();
    }
})();
</script>
