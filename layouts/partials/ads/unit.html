{{- /* One AdSense responsive display unit.
     Usage: partial "ads/unit.html" (dict "position" "tool_after")
     The sidebar unit is rectangle/vertical (300×250 … 300×600) and passes
     "deferPush" true: it lives in a <template> and assets/js/site.js pushes
     it only once it is inserted at >= 1100 px.
     Positions map to [params.ads] slot_<position>; an empty or missing
     slot falls back to slot_default. The .ad-slot container reserves its
     height up front (ad-slot.css) so the creative filling in causes no CLS.
     The adsbygoogle.js loader itself is injected by extend_head.html. */ -}}
{{- $ads := site.Params.ads -}}
{{- $pos := .position | default "default" -}}
{{- $slot := (index $ads (printf "slot_%s" $pos)) | default $ads.slot_default -}}
{{- if and $ads.client $slot }}
{{- /* adsbygoogle.js rewrites every ancestor of the <ins> to
     "height:auto !important; min-height:0 !important", so a min-height on
     the container cannot reserve space (unfilled slots collapsed from 280
     to ~70 px after load: a layout shift). The reservation is a SIBLING
     spacer instead, stacked in the same grid cell as the ad: the cell is
     at least the spacer's height and grows if the creative is taller. */ -}}
<div class="ad-slot ad-slot--{{ $pos | replaceRE "_" "-" }}">
  <span class="ad-slot-label">{{ i18n "ad_label" | default "Advertisement" }}</span>
  <div class="ad-slot-spacer" aria-hidden="true"></div>
  <div class="ad-slot-inner">
    <ins class="adsbygoogle"
         style="display:block;width:100%"
         data-ad-client="{{ $ads.client }}"
         data-ad-slot="{{ $slot }}"
         {{- if eq $pos "sidebar" }}
         data-ad-format="rectangle, vertical"
         {{- else }}
         data-ad-format="auto"
         data-full-width-responsive="true"
         {{- end }}></ins>
  </div>
  {{- if not .deferPush }}
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  {{- end }}
</div>
{{- end }}
