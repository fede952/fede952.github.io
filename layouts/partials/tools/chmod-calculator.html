<div class="chmod-calculator">

  <div class="chmod-grid">
    <div class="chmod-header"></div>
    <div class="chmod-header">{{ i18n "chmod_read" }} (4)</div>
    <div class="chmod-header">{{ i18n "chmod_write" }} (2)</div>
    <div class="chmod-header">{{ i18n "chmod_execute" }} (1)</div>

    <div class="chmod-label">{{ i18n "chmod_owner" }}</div>
    <label class="switch"><input type="checkbox" data-who="owner" data-perm="4" checked><span class="slider"></span></label>
    <label class="switch"><input type="checkbox" data-who="owner" data-perm="2" checked><span class="slider"></span></label>
    <label class="switch"><input type="checkbox" data-who="owner" data-perm="1" checked><span class="slider"></span></label>

    <div class="chmod-label">{{ i18n "chmod_group" }}</div>
    <label class="switch"><input type="checkbox" data-who="group" data-perm="4" checked><span class="slider"></span></label>
    <label class="switch"><input type="checkbox" data-who="group" data-perm="2"><span class="slider"></span></label>
    <label class="switch"><input type="checkbox" data-who="group" data-perm="1" checked><span class="slider"></span></label>

    <div class="chmod-label">{{ i18n "chmod_others" }}</div>
    <label class="switch"><input type="checkbox" data-who="public" data-perm="4" checked><span class="slider"></span></label>
    <label class="switch"><input type="checkbox" data-who="public" data-perm="2"><span class="slider"></span></label>
    <label class="switch"><input type="checkbox" data-who="public" data-perm="1" checked><span class="slider"></span></label>
  </div>

  <div class="chmod-filename-wrap">
    <label for="chmod-filename" class="chmod-filename-label">{{ i18n "chmod_filename" }}</label>
    <input type="text" id="chmod-filename" class="chmod-filename-input" value="script.sh" spellcheck="false">
  </div>

  <div class="chmod-result-box">
    <div class="chmod-result-line">
      <span class="chmod-prompt">$</span>
      <span class="chmod-cmd">chmod</span>
      <span id="chmod-octal" class="chmod-octal">755</span>
      <span id="chmod-file-display" class="chmod-file">script.sh</span>
    </div>
    <div class="chmod-symbol-line" id="chmod-symbol">-rwxr-xr-x</div>
  </div>

  <button class="chmod-copy-btn" id="chmod-copy-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
    {{ i18n "chmod_copy" }}
  </button>

  <div class="chmod-presets">
    <span class="chmod-presets-label">{{ i18n "chmod_presets" }}</span>
    <button class="chmod-preset-btn" data-preset="755">755</button>
    <button class="chmod-preset-btn" data-preset="644">644</button>
    <button class="chmod-preset-btn" data-preset="777">777</button>
    <button class="chmod-preset-btn" data-preset="600">600</button>
    <button class="chmod-preset-btn" data-preset="444">444</button>
  </div>

</div>

<style>
.chmod-calculator {
  max-width: 620px;
  margin: 0 auto;
  font-family: var(--font-sans);
}

.chmod-grid {
  display: grid;
  grid-template-columns: 1fr repeat(3, 1fr);
  gap: 15px;
  background: var(--bg-raised);
  padding: 25px 20px;
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  align-items: center;
}

.chmod-label {
  color: var(--accent);
  font-weight: bold;
  font-size: 0.95rem;
}

.chmod-header {
  color: var(--text-2);
  text-align: center;
  font-size: 0.8rem;
  letter-spacing: 0.5px;
}

/* Neon Toggle Switch */
.switch {
  position: relative;
  display: inline-block;
  width: 50px;
  height: 26px;
  justify-self: center;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: var(--surface-3);
  border: 1px solid var(--border-input);
  transition: 0.3s;
  border-radius: 34px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background-color: var(--text-3);
  transition: 0.3s;
  border-radius: 50%;
}

input:checked + .slider {
  background-color: var(--accent-soft);
  border-color: var(--accent);
}

input:checked + .slider:before {
  transform: translateX(24px);
  background-color: var(--accent);
}

/* Filename Input */
.chmod-filename-wrap {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  margin-top: 20px;
  padding: 0 5px;
}

.chmod-filename-label {
  color: var(--text-2);
  font-size: 0.85rem;
  white-space: nowrap;
}

.chmod-filename-input {
  flex: 1 1 10rem;
  min-width: 0;
  background: var(--bg-raised);
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  padding: 8px 12px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.2s;
}

.chmod-filename-input:focus {
  border-color: var(--accent);
}

/* Result Terminal Box */
.chmod-result-box {
  margin-top: 20px;
  background: var(--bg-raised);
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 20px 25px;
}

.chmod-result-line {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.4rem;
  flex-wrap: wrap;
}

.chmod-prompt {
  color: var(--accent);
  font-weight: bold;
}

.chmod-cmd {
  color: var(--text-2);
}

.chmod-octal {
  color: var(--accent-2);
  font-weight: bold;
}

.chmod-file {
  color: var(--accent);
}

.chmod-symbol-line {
  margin-top: 10px;
  color: var(--text-3);
  font-size: 1rem;
}

/* Copy Button */
.chmod-copy-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 20px auto;
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 10px 24px;
  border-radius: 6px;
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 0.9rem;
  font-weight: 600;
  transition: all 0.2s;
}

.chmod-copy-btn:hover {
  background: var(--accent);
  color: var(--accent-ink);
}

.chmod-copy-btn.copied {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}

/* Presets */
.chmod-presets {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 15px;
  flex-wrap: wrap;
}

.chmod-presets-label {
  color: var(--text-3);
  font-size: 0.8rem;
}

.chmod-preset-btn {
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  color: var(--text-2);
  padding: 5px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  transition: all 0.2s;
}

.chmod-preset-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

@media (max-width: 480px) {
  .chmod-grid {
    gap: 10px;
    padding: 15px;
  }

  .chmod-label {
    font-size: 0.8rem;
  }

  .chmod-header {
    font-size: 0.7rem;
  }

  .switch {
    width: 42px;
    height: 22px;
  }

  .slider:before {
    height: 14px;
    width: 14px;
  }

  input:checked + .slider:before {
    transform: translateX(20px);
  }

  .chmod-result-line {
    font-size: 1.1rem;
  }
}
</style>

<script>
(function() {
  var L = { copy: {{ i18n "chmod_copy" }}, copied: {{ i18n "chmod_copied" }} };
  // POSIX single-quote a file name if it contains anything the shell would
  // interpret (spaces, $, *, quotes...), e.g. my file.sh -> 'my file.sh'
  function shellQuote(name) {
    return /^[A-Za-z0-9._\/@%+=:,-]+$/.test(name) ? name : "'" + name.replace(/'/g, "'\\''") + "'";
  }
  const checkboxes = document.querySelectorAll('.chmod-calculator input[type="checkbox"]');
  const octalEl = document.getElementById('chmod-octal');
  const symbolEl = document.getElementById('chmod-symbol');
  const fileDisplay = document.getElementById('chmod-file-display');
  const filenameInput = document.getElementById('chmod-filename');
  const copyBtn = document.getElementById('chmod-copy-btn');
  const presetBtns = document.querySelectorAll('.chmod-preset-btn');

  function calculate() {
    const perms = { owner: 0, group: 0, public: 0 };

    checkboxes.forEach(function(cb) {
      if (cb.checked) {
        perms[cb.dataset.who] += parseInt(cb.dataset.perm);
      }
    });

    const octal = '' + perms.owner + perms.group + perms['public'];
    octalEl.textContent = octal;

    // Build symbolic representation
    const symbol = '-' +
      toSymbol(perms.owner) +
      toSymbol(perms.group) +
      toSymbol(perms['public']);
    symbolEl.textContent = symbol;
  }

  function toSymbol(val) {
    return (val & 4 ? 'r' : '-') +
           (val & 2 ? 'w' : '-') +
           (val & 1 ? 'x' : '-');
  }

  function applyPreset(octalStr) {
    var digits = octalStr.split('').map(Number);
    var groups = ['owner', 'group', 'public'];
    checkboxes.forEach(function(cb) {
      var groupIndex = groups.indexOf(cb.dataset.who);
      var permVal = parseInt(cb.dataset.perm);
      cb.checked = (digits[groupIndex] & permVal) !== 0;
    });
    calculate();
  }

  checkboxes.forEach(function(cb) {
    cb.addEventListener('change', calculate);
  });

  filenameInput.addEventListener('input', function() {
    fileDisplay.textContent = this.value || 'filename';
  });

  copyBtn.addEventListener('click', function() {
    var cmd = 'chmod ' + octalEl.textContent + ' ' + shellQuote(filenameInput.value || 'filename');
    navigator.clipboard.writeText(cmd).then(function() {
      copyBtn.classList.add('copied');
      copyBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> ' + L.copied;
      setTimeout(function() {
        copyBtn.classList.remove('copied');
        copyBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> ' + L.copy;
      }, 2000);
    });
  });

  presetBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      applyPreset(this.dataset.preset);
    });
  });

  // Initial calculation
  calculate();
})();
</script>
