<style>
.bar { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; }
.tb-textarea { min-height: 220px; font-family: var(--font-mono); font-size: var(--fs-xs); }

.kv { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }

.kv th { width: 9rem; color: var(--text-2); font-weight: 600; }
.kv tbody th, .kv thead th { white-space: nowrap; }
.kv td { overflow-wrap: break-word; word-break: break-word; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border-input); border-radius: var(--r-sm); }
.res { display: inline-block; min-width: 4.5rem; padding: 1px var(--s-2); border-radius: 999px; font-size: var(--fs-xs); font-weight: 700; text-align: center; }
.r-pass { background: var(--success-soft); color: var(--success); } .r-fail { background: var(--danger-soft); color: var(--danger); }
.r-warn { background: var(--warn-soft); color: var(--warn); } .r-none { background: var(--bg); color: var(--text-3); border: 1px solid var(--border-input); }
.signals { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s-2); }
.sig { display: grid; grid-template-columns: auto 1fr; gap: var(--s-3); padding: var(--s-3); border: 1px solid var(--border); border-left: 4px solid var(--border-input); border-radius: var(--r-sm); background: var(--bg-raised); }
.sig p { margin: var(--s-1) 0 0; color: var(--text-2); font-size: var(--fs-sm); overflow-wrap: anywhere; }
.pill { display: inline-block; min-width: 4.5rem; padding: 2px var(--s-2); border-radius: 999px; font-size: var(--fs-xs); font-weight: 700; text-align: center; white-space: nowrap; }
.s-high { border-left-color: var(--danger); } .s-high .pill { background: var(--danger-soft); color: var(--danger); }
.s-medium { border-left-color: var(--warn); } .s-medium .pill { background: var(--warn-soft); color: var(--warn); }
.s-low { border-left-color: var(--accent); } .s-low .pill { background: var(--accent-soft); color: var(--accent); }
.s-info .pill { border: 1px solid var(--border-input); color: var(--text-2); }
.s-good { border-left-color: var(--success); } .s-good .pill { background: var(--success-soft); color: var(--success); }
.hops { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s-2); }
.hop { display: grid; grid-template-columns: 2rem 1fr; gap: var(--s-2); }
.hop-n { display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--surface-3); font-weight: 700; font-size: var(--fs-sm); }
.hop-body { padding: var(--s-2) var(--s-3); border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--bg-raised); font-size: var(--fs-sm); overflow-wrap: anywhere; }
.hop-body code { font-size: var(--fs-xs); }
.delay { color: var(--text-3); font-size: var(--fs-xs); }
.delay.slow { color: var(--warn); }
@media (max-width: 560px) { .sig { grid-template-columns: 1fr; } .pill { justify-self: start; } .kv th { width: auto; } }
</style>
</head>

<main class="tb-app">
  <header class="tb-head">
    <span class="tb-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6l8.5 6 8.5-6"/><path d="M7 15h5"/></svg></span>
    <div>
      <h1 class="tb-title" data-i18n="title">Email Header Analyzer</h1>
      <p class="tb-sub" data-i18n="subtitle">Trace the route, check SPF/DKIM/DMARC and spot spoofing — in your browser</p>
    </div>
  </header>

  <div class="tb-field">
    <label class="tb-label" for="in" data-i18n="input">Raw email headers</label>
    <textarea id="in" class="tb-textarea" spellcheck="false" autocomplete="off" data-i18n-placeholder="placeholder"></textarea>
    <p class="tb-hint" data-i18n="hint">Paste the full headers (or the whole message source). Nothing is sent anywhere.</p>
  </div>
  <div class="bar">
    <button type="button" class="tb-btn" id="go" data-i18n="analyze">Analyze</button>
    <button type="button" class="tb-btn tb-btn--ghost" id="s-legit" data-i18n="sampleLegit">Sample: genuine</button>
    <button type="button" class="tb-btn tb-btn--ghost" id="s-phish" data-i18n="samplePhish">Sample: phishing</button>
    <button type="button" class="tb-btn tb-btn--ghost" id="clear" data-i18n="clear">Clear</button>
  </div>
  <div id="out" aria-live="polite"></div>
</main>

TK.init(UI);
const S = Object.assign({}, SIG.en, SIG[TK.lang] || {});
const $ = (id) => document.getElementById(id);
const t = TK.t, esc = TK.esc;
const fill = (s, p) => s.replace(/\{(\w+)\}/g, (m, k) => (p[k] !== undefined ? p[k] : m));
const resClass = (r) => !r ? 'r-none' : r === 'pass' ? 'r-pass' : /fail/.test(r) && r !== 'softfail' ? 'r-fail' : r === 'none' ? 'r-none' : 'r-warn';

function run() {
  const r = analyze($('in').value);
  if (r.signals.length === 1 && r.signals[0].id === 'empty') { $('out').innerHTML = $('in').value.trim() ? `<p class="tb-note tb-note--warn">${esc(S.empty[0])}. ${esc(S.empty[1])}</p>` : ''; return; }
  const v = verdict(r.signals);
  const addr = (a) => (a ? esc(a.name ? `${a.name} <${a.address}>` : a.address) : t('none'));
  const html = [];
  html.push(`<div class="verdict-box v-${v}" role="status"><div><b>${esc(t('v_' + v))}</b><p class="tb-hint" style="margin:0">${esc(t('vd_' + v))}</p></div></div>`);
  html.push(`<h2 class="sec">${esc(t('signals'))}</h2><ul class="signals">`);
  for (const s of r.signals) {
    const [title, text] = (S[s.id] || [s.id, '']).map((x) => fill(x, s.p));
    html.push(`<li class="sig s-${s.sev}" data-id="${s.id}"><span class="pill">${esc(t(s.sev))}</span><div><strong>${esc(title)}</strong><p>${esc(text)}</p></div></li>`);
  }
  html.push('</ul>');
  html.push(`<h2 class="sec">${esc(t('identity'))}</h2><div class="tbl-wrap"><table class="kv"><tbody>
    <tr><th scope="row">${esc(t('from'))}</th><td>${addr(r.from)}</td></tr>
    <tr><th scope="row">${esc(t('replyTo'))}</th><td>${addr(r.replyTo)}</td></tr>
    <tr><th scope="row">${esc(t('returnPath'))}</th><td>${addr(r.returnPath)}</td></tr>
    ${r.sender ? `<tr><th scope="row">${esc(t('sender'))}</th><td>${addr(r.sender)}</td></tr>` : ''}
    <tr><th scope="row">${esc(t('msgid'))}</th><td>${esc(r.messageIdDomain || t('none'))}</td></tr>
    <tr><th scope="row">${esc(t('mailer'))}</th><td>${esc(r.mailer || t('none'))}</td></tr></tbody></table></div>`);
  if (r.auth) {
    const rows = [['SPF', r.auth.spf, r.auth.spf ? r.auth.spf.props['smtp.mailfrom'] : ''],
      ...r.auth.dkim.map((d) => ['DKIM', d, [d.props['header.d'] || d.props['header.i'], d.props['header.s'] && `s=${d.props['header.s']}`].filter(Boolean).join(' ')]),
      ['DMARC', r.auth.dmarc, r.auth.dmarc ? [r.auth.dmarc.props['header.from'], r.auth.dmarc.policy && `p=${r.auth.dmarc.policy}`].filter(Boolean).join(' ') : ''],
      ...(r.auth.arc ? [['ARC', r.auth.arc, '']] : [])];
    if (!r.auth.dkim.length) rows.splice(1, 0, ['DKIM', null, '']);
    html.push(`<h2 class="sec">${esc(t('auth'))}</h2><p class="tb-hint">${esc(t('authserv', { s: r.auth.authserv }))}</p><div class="tbl-wrap"><table class="kv"><thead><tr><th scope="col">${esc(t('method'))}</th><th scope="col">${esc(t('result'))}</th><th scope="col">${esc(t('detail'))}</th></tr></thead><tbody>`
      + rows.map(([m, x, d]) => `<tr><th scope="row">${m}</th><td><span class="res ${resClass(x && x.result)}">${esc(x ? x.result : 'none')}</span></td><td>${esc(d || '')}</td></tr>`).join('') + '</tbody></table></div>');
  }
  if (r.hops.length) {
    const u = { s: t('s'), min: t('min'), h: t('h') };
    html.push(`<h2 class="sec">${esc(t('route', { n: r.hops.length }))}</h2><ol class="hops">` + r.hops.map((h, i) => `<li class="hop"><span class="hop-n" aria-hidden="true">${i + 1}</span><div class="hop-body">
      <div><code>${esc(h.from || '?')}</code>${h.fromIp ? ` <span class="delay">${esc(t('ip'))} ${esc(h.fromIp)}</span>` : ''}</div>
      <div>→ ${esc(t('by'))} <code>${esc(h.by || '?')}</code>${h.with ? ` ${esc(t('with'))} ${esc(h.with)}` : ''}</div>
      <div class="delay${h.delay > 3600 ? ' slow' : ''}">${h.date ? esc(h.date.toISOString().replace('T', ' ').slice(0, 19) + ' UTC') : ''}${h.delay !== null ? ' · ' + esc(t('delay', { d: formatDelay(h.delay, u) })) : (i === 0 ? ' · ' + esc(t('firstHop')) : '')}</div></div></li>`).join('') + '</ol>');
  }
  $('out').innerHTML = html.join('');
  window.__headersAnalyzed = (window.__headersAnalyzed || 0) + 1;
}
let timer;
$('in').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 250); });
$('go').addEventListener('click', run);
$('s-legit').addEventListener('click', () => { $('in').value = SAMPLES.legit; run(); });
$('s-phish').addEventListener('click', () => { $('in').value = SAMPLES.phish; run(); });
$('clear').addEventListener('click', () => { $('in').value = ''; run(); $('in').focus(); });
window.__emailReady = true;
