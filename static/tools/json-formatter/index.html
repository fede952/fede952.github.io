<style>
.bar { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; }
.bar .tb-select { width: auto; min-width: 7rem; }
.io { display: grid; gap: var(--s-3); }
@media (min-width: 900px) { .io { grid-template-columns: 1fr 1fr; } }
.tb-textarea { min-height: 300px; }
#out { min-height: 300px; }
.errline { margin: var(--s-2) 0 0; padding: var(--s-2) var(--s-3); overflow-x: auto; border-radius: var(--r-sm); background: var(--bg-raised); font-family: var(--font-mono); font-size: var(--fs-xs); white-space: pre; }
.tree { min-height: 300px; max-height: 70vh; overflow: auto; padding: var(--s-3); border: 1px solid var(--border-input); border-radius: var(--r); background: var(--bg-raised); font-family: var(--font-mono); font-size: var(--fs-sm); line-height: 1.7; }
.tree details { padding-left: 1.1em; }
.tree > details { padding-left: 0; }
.tree summary { cursor: pointer; list-style: none; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary::before { content: '▸'; display: inline-block; width: 1em; color: var(--text-3); }
.tree details[open] > summary::before { content: '▾'; }
.tree .leaf { padding-left: 2.1em; }
.k { color: var(--accent-2); } .s { color: var(--success); } .n { color: var(--accent); } .b { color: var(--warn); } .z { color: var(--text-3); } .m { color: var(--text-3); }
</style>
</head>

    </div>

const $ = (id) => document.getElementById(id);
const t = TK.t, esc = TK.esc;
const BIG = 2 * 1024 * 1024; // above this, parse in a Web Worker
let mode = 'json', lastName = 'formatted.json', lastValue = null, worker = null;
const sizeStr = (b) => b >= 1048576 ? (b / 1048576).toFixed(2) + ' MB' : b >= 1024 ? (b / 1024).toFixed(1) + ' KB' : b + ' B';
const indent = () => $('indent').value;
const delim = () => ($('delim').value === 'tab' ? '\t' : $('delim').value);

function status(msg, kind) { $('status').textContent = msg; $('status').className = 'tb-note' + (kind ? ' tb-note--' + kind : ''); }
function showError(err) {
  status(t('errAt', { line: err.line, column: err.column, what: t('c-' + err.code) }), 'bad');
  const text = $('in').value, lines = text.split('\n'), line = lines[err.line - 1] || '';
  const from = Math.max(0, err.column - 60);
  $('errline').textContent = `${String(err.line).padStart(4)} | ${line.slice(from, from + 120)}\n     | ${' '.repeat(err.column - 1 - from)}^`;
  $('errbox').hidden = false;
  try { $('in').focus({ preventScroll: true }); $('in').setSelectionRange(err.index, Math.min(err.index + 1, text.length)); } catch (e) { /* */ }
}
function setOut(text, name) { $('out').value = text; lastName = name; $('errbox').hidden = true; if (!$('tree').hidden) renderTree(); }

/** Parses the input (YAML when in YAML mode). Returns { value } or null after reporting the error. */
async function parse() {
  const text = $('in').value;
  if (!text.trim()) { status(t('empty'), 'warn'); return null; }
  if (mode === 'yaml') {
    await yaml();
    try { const value = window.jsyaml.load(text); status(t('validYaml', { size: sizeStr(J.utf8Length(text)) }), 'ok'); return { value }; }
    catch (e) { status(t('yamlErr', { msg: e.message.split('\n')[0] }), 'bad'); return null; }
  }
  try {
    const value = JSON.parse(text);
    const s = J.stats(value);
    status(t('valid', { size: sizeStr(J.utf8Length(text)), ...s }), 'ok');
    return { value };
  } catch (e) {
    showError(J.locateError(text) || { code: 'unknown', line: 1, column: 1, index: 0 });
    return null;
  }
}

function viaWorker(op) {
  worker ||= new Worker('/js/tools/json-worker.mjs', { type: 'module' });
  return new Promise((ok) => { worker.onmessage = (e) => ok(e.data); worker.postMessage({ op, text: $('in').value, indent: indent(), sorted: $('sort').checked }); });
}

async function run(op) {
  $('errbox').hidden = true;
  if (mode === 'json' && J.utf8Length($('in').value) > BIG && (op === 'format' || op === 'minify')) {
    status(t('worker'));
    const r = await viaWorker(op);
    if (!r.ok) return showError(r.error);
    lastValue = null;
    setOut(r.output, op === 'minify' ? 'minified.json' : 'formatted.json');
    status(t('valid', { size: sizeStr(J.utf8Length($('in').value)), ...r.stats }) + ' · ' + t('worker'), 'ok');
    return;
  }
  const p = await parse();
  if (!p) return;
  lastValue = p.value;
  const sorted = $('sort').checked;
  if (op === 'format') setOut(J.format(p.value, indent(), sorted), 'formatted.json');
  else if (op === 'minify') setOut(J.minify(p.value, sorted), 'minified.json');
  else if (op === 'yaml') { await yaml(); setOut(window.jsyaml.dump(sorted ? J.sortKeys(p.value) : p.value, { indent: indent() === '4' ? 4 : 2, lineWidth: -1, noRefs: true }), 'converted.yaml'); }
  else if (op === 'csv') {
    const r = J.toCsv(p.value, delim());
    if (r.error) return status(t(r.error), 'bad');
    setOut(r.csv, 'converted.csv');
    if (r.rows) status(t('csvDone', r), 'ok');
  }
}

let yamlP = null;
function yaml() {
  return (yamlP ||= new Promise((ok, fail) => { const s = document.createElement('script'); s.src = '/vendor/js-yaml@4.1.0/js-yaml.min.js'; s.onload = ok; s.onerror = fail; document.head.appendChild(s); }));
}

/* ── Tree view (rendered lazily: children only when a node is opened) ── */
function leaf(v) {
  if (v === null) return '<span class="z">null</span>';
  if (typeof v === 'string') return `<span class="s">"${esc(v)}"</span>`;
  if (typeof v === 'number') return `<span class="n">${v}</span>`;
  return `<span class="b">${v}</span>`;
}
function node(key, v, open) {
  const label = key === null ? '' : `<span class="k">${esc(key)}</span>: `;
  if (v === null || typeof v !== 'object') { const d = document.createElement('div'); d.className = 'leaf'; d.innerHTML = label + leaf(v); return d; }
  const isArr = Array.isArray(v), keys = isArr ? v.map((_, i) => i) : Object.keys(v);
  const det = document.createElement('details');
  det.innerHTML = `<summary>${label}<span class="m">${isArr ? `[ ${keys.length} ]` : `{ ${keys.length} }`}</span></summary>`;
  let filled = false;
  const fill = () => {
    if (filled) return; filled = true;
    const LIMIT = 500;
    keys.slice(0, LIMIT).forEach((k) => det.appendChild(node(isArr ? String(k) : k, v[k], false)));
    if (keys.length > LIMIT) { const m = document.createElement('div'); m.className = 'leaf m'; m.textContent = t('more', { n: keys.length - LIMIT }); det.appendChild(m); }
  };
  det.addEventListener('toggle', () => det.open && fill());
  if (open) { det.open = true; fill(); }
  return det;
}
function renderTree() {
  const tree = $('tree');
  tree.replaceChildren();
  let v = lastValue;
  if (v === null) { try { v = JSON.parse($('out').value || $('in').value); } catch (e) { v = undefined; } }
  if (v !== undefined) tree.appendChild(node(null, v, true));
}

/* ── wiring ── */
$('fmt').addEventListener('click', () => run('format'));
$('min').addEventListener('click', () => run('minify'));
$('toyaml').addEventListener('click', () => run('yaml'));
$('tocsv').addEventListener('click', () => run('csv'));
$('sample').addEventListener('click', () => {
  $('in').value = mode === 'yaml'
    ? 'service: checkout\nreplicas: 3\nports:\n  - 80\n  - 443\nenv:\n  LOG_LEVEL: info\n  FEATURE_FLAGS: [beta, dark-mode]\n'
    : '{"users":[{"id":1,"name":"Ada","roles":["admin","dev"],"active":true},{"id":2,"name":"Linus","roles":["dev"],"active":false,"last_login":null}],"generated":"2026-10-25T10:00:00Z"}';
  run('format');
});
$('clear').addEventListener('click', () => { $('in').value = ''; setOut('', 'formatted.json'); status(''); $('errbox').hidden = true; lastValue = null; });
$('openf').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async (e) => { const f = e.target.files[0]; if (!f) return; $('in').value = await f.text(); if (/\.ya?ml$/i.test(f.name)) setMode('yaml'); e.target.value = ''; run('format'); });
$('save').addEventListener('click', () => { const v = $('out').value; if (v) TK.download(new Blob([v], { type: /\.csv$/.test(lastName) ? 'text/csv' : /\.yaml$/.test(lastName) ? 'application/yaml' : 'application/json' }), lastName); });
function setMode(m) {
  mode = m;
  $('in-json').setAttribute('aria-selected', m === 'json'); $('in-yaml').setAttribute('aria-selected', m === 'yaml');
  $('in').placeholder = m === 'yaml' ? 'service: api\nreplicas: 2' : t('placeholder');
  $('toyaml').hidden = m === 'yaml';
}
$('in-json').addEventListener('click', () => setMode('json'));
$('in-yaml').addEventListener('click', () => setMode('yaml'));
$('v-text').addEventListener('click', () => { $('v-text').setAttribute('aria-selected', true); $('v-tree').setAttribute('aria-selected', false); $('out').hidden = false; $('tree').hidden = true; });
$('v-tree').addEventListener('click', () => { $('v-tree').setAttribute('aria-selected', true); $('v-text').setAttribute('aria-selected', false); $('out').hidden = true; $('tree').hidden = false; renderTree(); });
$('in').addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run('format'); } });
window.__jsonReady = true;
</script>
<script src="/js/tool-kit.js"></script>
<script src="/js/embed-resize.js"></script>
</body>
</html>
