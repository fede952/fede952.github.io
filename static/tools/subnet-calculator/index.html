<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://federicosella.com/en/tools/subnet-calculator/">
<title>Subnet Calculator (IPv4 / IPv6, CIDR, VLSM)</title>
<link rel="stylesheet" href="/css/tool-base.css">
<style>
.bin { font-family: var(--font-mono); font-size: var(--fs-sm); letter-spacing: .02em; overflow-wrap: anywhere; }
.bin .net { color: var(--accent); }
.bin .host { color: var(--text-2); }
.err { color: var(--danger); font-size: var(--fs-sm); min-height: 1.2em; margin: 0; }
.mode { display: flex; flex-wrap: wrap; gap: var(--s-4); }
.tb-kv dd .tb-badge { font-family: var(--font-sans); }
.sum { color: var(--text-2); font-size: var(--fs-sm); margin: 0; }
</style>
</head>
<body>
<main class="tb-app">
  <header class="tb-head">
    <span class="tb-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/></svg></span>
    <div>
      <h1 class="tb-title" data-i18n="title">Subnet Calculator</h1>
      <p class="tb-sub" data-i18n="subtitle">IPv4 and IPv6 · CIDR · VLSM — calculated in your browser</p>
    </div>
  </header>

  <div class="tb-tabs" role="tablist">
    <button class="tb-tab" role="tab" id="tab-v4" aria-controls="pane-v4" aria-selected="true" data-i18n="tabV4">IPv4</button>
    <button class="tb-tab" role="tab" id="tab-v6" aria-controls="pane-v6" aria-selected="false" data-i18n="tabV6">IPv6</button>
    <button class="tb-tab" role="tab" id="tab-split" aria-controls="pane-split" aria-selected="false" data-i18n="tabSplit">Split (VLSM)</button>
  </div>

  <!-- IPv4 -->
  <section id="pane-v4" role="tabpanel" aria-labelledby="tab-v4" class="tb-panel">
    <label class="tb-field">
      <span class="tb-label" data-i18n="v4Label">IPv4 address with prefix or mask</span>
      <input id="v4" class="tb-input tb-mono" value="192.168.1.10/24" autocomplete="off" spellcheck="false" inputmode="decimal">
      <span class="tb-hint" data-i18n="v4Hint">e.g. 10.0.0.5/8 · 172.16.5.4 255.255.240.0 · 192.168.1.1 0.0.0.255</span>
    </label>
    <p class="err" id="v4err" role="alert"></p>
    <dl class="tb-kv" id="v4out"></dl>
    <div id="v4bin" class="tb-scroll"></div>
  </section>

  <!-- IPv6 -->
  <section id="pane-v6" role="tabpanel" aria-labelledby="tab-v6" class="tb-panel" hidden>
    <label class="tb-field">
      <span class="tb-label" data-i18n="v6Label">IPv6 address with prefix</span>
      <input id="v6" class="tb-input tb-mono" value="2001:db8:abcd:12::1/48" autocomplete="off" spellcheck="false">
      <span class="tb-hint" data-i18n="v6Hint">Full or compressed form; no prefix means /128.</span>
    </label>
    <p class="err" id="v6err" role="alert"></p>
    <dl class="tb-kv" id="v6out"></dl>
  </section>

  <!-- Split -->
  <section id="pane-split" role="tabpanel" aria-labelledby="tab-split" class="tb-panel" hidden>
    <label class="tb-field">
      <span class="tb-label" data-i18n="splitBase">Network to split</span>
      <input id="sbase" class="tb-input tb-mono" value="10.0.0.0/24" autocomplete="off" spellcheck="false">
    </label>
    <div class="mode" role="radiogroup">
      <label class="tb-check"><input type="radio" name="smode" value="equal" checked> <span data-i18n="modeEqual">Into equal subnets</span></label>
      <label class="tb-check"><input type="radio" name="smode" value="hosts"> <span data-i18n="modeHosts">By hosts per subnet (VLSM)</span></label>
    </div>
    <label class="tb-field" id="f-count">
      <span class="tb-label" data-i18n="countLabel">Number of subnets</span>
      <input id="scount" class="tb-input" type="number" min="1" max="65536" value="4">
    </label>
    <label class="tb-field" id="f-hosts" hidden>
      <span class="tb-label" data-i18n="hostsLabel">Hosts needed in each subnet, comma-separated</span>
      <input id="shosts" class="tb-input tb-mono" value="100, 50, 20, 2" autocomplete="off" spellcheck="false">
    </label>
    <p class="err" id="serr" role="alert"></p>
    <p class="sum" id="ssum"></p>
    <div class="tb-scroll"><table class="tb-table" id="sout"></table></div>
    <div class="tb-row"><button type="button" class="tb-btn tb-btn--ghost tb-btn--sm" id="scopy" data-i18n="copyTable" hidden>Copy table</button></div>
  </section>
</main>

const $ = (id) => document.getElementById(id);
const t = TK.t, esc = TK.esc, f = S.formatIPv4;
const row = (k, v, extra = '') => `<dt>${esc(t(k))}</dt><dd>${esc(v)}${extra}</dd><dd><button type="button" class="tb-btn tb-btn--ghost tb-btn--sm" data-copy-text="${esc(v)}">${esc(t('copy'))}</button></dd>`;
const scopeBadge = (s) => ` <span class="tb-badge ${s === 'public' || s === 'global' ? 'tb-badge--info' : 'tb-badge--ok'}">${esc(t('s_' + s))}</span>`;

function ipv4() {
  const r = S.parseIPv4Cidr($('v4').value);
  $('v4err').textContent = r.error ? t('e-' + r.error) : '';
  if (r.error) { $('v4out').innerHTML = ''; $('v4bin').innerHTML = ''; return; }
  const i = S.ipv4Info(r.ip, r.prefix);
  const note = i.prefix === 31 ? ` (${t('p2p')})` : i.prefix === 32 ? ` (${t('single')})` : '';
  $('v4out').innerHTML =
    row('address', f(i.ip), scopeBadge(i.scope)) +
    row('cidr', `${f(i.network)}/${i.prefix}`) +
    row('network', f(i.network)) +
    row('broadcast', i.hasBroadcast ? f(i.broadcast) : t('none')) +
    row('first', f(i.first)) +
    row('last', f(i.last)) +
    row('mask', f(i.mask)) +
    row('wildcard', f(i.wildcard)) +
    row('usable', TK.num(i.usable) + note) +
    row('total', TK.num(i.total));
  const fmtBin = (n) => { const b = S.toBinary32(n); let out = '', bit = 0; for (const c of b) { if (c === '.') { out += '.'; continue; } out += `<span class="${bit < i.prefix ? 'net' : 'host'}">${c}</span>`; bit++; } return out; };
  $('v4bin').innerHTML = `<table class="tb-table"><caption class="tb-panel-title" style="text-align:left;padding-bottom:6px">${esc(t('binary'))}</caption>` +
    [['address', i.ip], ['mask', i.mask], ['network', i.network]].map(([k, n]) => `<tr><th scope="row">${esc(t(k))}</th><td class="bin">${fmtBin(n)}</td></tr>`).join('') + '</table>';
}

function ipv6() {
  const r = S.parseIPv6Cidr($('v6').value);
  $('v6err').textContent = r.error ? t('e-' + r.error) : '';
  if (r.error) { $('v6out').innerHTML = ''; return; }
  const i = S.ipv6Info(r.ip, r.prefix);
  $('v6out').innerHTML =
    row('compressed', S.compressIPv6(i.ip), scopeBadge(i.scope)) +
    row('expanded', S.expandIPv6(i.ip)) +
    row('network', `${S.compressIPv6(i.network)}/${i.prefix}`) +
    row('firstAddr', S.compressIPv6(i.network)) +
    row('lastAddr', S.compressIPv6(i.last)) +
    row('total', S.humanBig(i.total)) +
    (i.prefix <= 64 ? row('subnets64', S.humanBig(i.subnets64)) : '');
}

let tableText = '';
function split() {
  const base = S.parseIPv4Cidr($('sbase').value);
  const hostsMode = document.querySelector('input[name=smode]:checked').value === 'hosts';
  $('f-count').hidden = hostsMode; $('f-hosts').hidden = !hostsMode;
  const fail = (e, vars) => { $('serr').textContent = t('e-' + e, vars); $('sout').innerHTML = ''; $('ssum').textContent = ''; $('scopy').hidden = true; };
  if (base.error) return fail(base.error);
  const net = (base.ip & S.maskFromPrefix(base.prefix)) >>> 0;
  let rows, head, sum;
  if (!hostsMode) {
    const r = S.splitEqual(net, base.prefix, Number($('scount').value));
    if (r.error) return fail(r.error);
    head = ['#', t('colNet'), t('mask'), t('colRange'), t('colHosts')];
    rows = r.subnets.slice(0, 1024).map((s, k) => [k + 1, `${f(s.network)}/${s.prefix}`, f(s.mask), `${f(s.first)} – ${f(s.last)}`, TK.num(s.usable)]);
    sum = t('sumEqual', { n: TK.num(r.subnets.length), p: r.prefix, h: TK.num(r.subnets[0].usable) });
  } else {
    const counts = $('shosts').value.split(/[,;\s]+/).filter(Boolean).map(Number);
    if (!counts.length || counts.some((n) => !Number.isInteger(n) || n < 1)) return fail('hosts');
    const r = S.vlsm(net, base.prefix, counts);
    if (r.error) return fail(r.error, { hosts: TK.num(r.hosts || 0) });
    head = ['#', t('colNeed'), t('colNet'), t('mask'), t('colRange'), t('colHosts')];
    rows = r.subnets.map((s, k) => [k + 1, TK.num(s.hosts), `${f(s.info.network)}/${s.info.prefix}`, f(s.info.mask), `${f(s.info.first)} – ${f(s.info.last)}`, TK.num(s.info.usable)]);
    sum = t('sumVlsm', { used: TK.num(r.used), size: TK.num(r.used + r.free), free: TK.num(r.free) });
  }
  $('serr').textContent = '';
  $('ssum').textContent = sum;
  $('sout').innerHTML = `<thead><tr>${head.map((h) => `<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>` +
    rows.map((r) => `<tr>${r.map((c, k) => `<td${k > 0 ? ' class="tb-mono"' : ''}>${esc(c)}</td>`).join('')}</tr>`).join('') + '</tbody>';
  tableText = [head, ...rows].map((r) => r.join('\t')).join('\n');
  $('scopy').hidden = false;
}

$('scopy').addEventListener('click', (e) => TK.copy(tableText, e.currentTarget));
$('v4').addEventListener('input', ipv4);
$('v6').addEventListener('input', ipv6);
['sbase', 'scount', 'shosts'].forEach((id) => $(id).addEventListener('input', split));
document.querySelectorAll('input[name=smode]').forEach((el) => el.addEventListener('change', split));

const tabs = [...document.querySelectorAll('.tb-tab')];
tabs.forEach((tab) => tab.addEventListener('click', () => {
  tabs.forEach((x) => { const on = x === tab; x.setAttribute('aria-selected', on); document.getElementById(x.getAttribute('aria-controls')).hidden = !on; });
}));
ipv4(); ipv6(); split();
window.__subnetReady = true;
</script>
<script src="/js/tool-kit.js"></script>
<script src="/js/embed-resize.js"></script>
</body>
</html>
