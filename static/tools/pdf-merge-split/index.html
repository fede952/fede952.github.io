<title>Merge, split and reorder PDF</title>

<style>
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--s-3); }
.actions .tb-panel { align-content: start; }
.count { color: var(--text-2); font-size: var(--fs-sm); margin: 0; }

    <div>

    </div>
  </header>

  <label class="tb-drop" id="drop" tabindex="0">
    <svg class="icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5h7l4 4V17a1.5 1.5 0 0 1-1.5 1.5H8A1.5 1.5 0 0 1 6.5 17V5A1.5 1.5 0 0 1 8 3.5z"/><path d="M15 3.5V7.5h4"/><path d="M3.5 7v12A1.5 1.5 0 0 0 5 20.5h9.5"/></svg>
    <strong data-i18n="drop">Drop PDF files here, or click to choose</strong>
    <span class="tb-hint" data-i18n="dropHint">Add several files to merge them; drag the pages to change the order.</span>
    <input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
  </label>

  <p class="tb-note" id="status" role="status" hidden></p>

  <section class="tb-panel" id="pages-panel" hidden aria-labelledby="pages-title">
    <div class="tb-row" style="justify-content:space-between">

  </section>

    <section class="tb-panel">
      <h2 class="tb-panel-title" data-i18n="mergeTitle">Merge</h2>
      <p class="tb-hint" data-i18n="mergeHint">One PDF with all the pages above, in this order.</p>
      <label class="tb-field"><span class="tb-label" data-i18n="fileName">File name</span><input id="mname" class="tb-input" value="merged.pdf"></label>
      <button type="button" class="tb-btn" id="merge" data-i18n="mergeBtn">Merge & download</button>
    </section>

      <h2 class="tb-panel-title" data-i18n="splitTitle">Split</h2>
      <label class="tb-check"><input type="radio" name="smode" value="each" checked> <span data-i18n="splitEach">Every page as its own PDF</span></label>
      <label class="tb-check"><input type="radio" name="smode" value="ranges"> <span data-i18n="splitRanges">By page ranges</span></label>
      <label class="tb-field" id="ranges-field" hidden><span class="tb-label" data-i18n="rangesLabel">Ranges (one file per group)</span><input id="ranges" class="tb-input tb-mono" value="1-2, 3-" spellcheck="false"><span class="tb-hint" data-i18n="rangesHint">e.g. 1-3, 4, 5- (page numbers as shown above)</span></label>
      <button type="button" class="tb-btn" id="split" data-i18n="splitBtn">Split & download (.zip)</button>
    </section>
  </div>
</main>

    splitTitle: 'Dividir', splitEach: 'Cada página num PDF separado', splitRanges: 'Por intervalos de páginas', rangesLabel: 'Intervalos (um arquivo por grupo)', rangesHint: 'ex.: 1-3, 4, 5- (números de página como acima)', splitBtn: 'Dividir e baixar (.zip)',
    left: 'Mover para a esquerda', right: 'Mover para a direita', remove: 'Remover página', rotate: 'Girar 90°', page: 'p. {n}',
    reading: 'Lendo {name}…', building: 'Gerando o PDF…', zipping: 'Gerando o ZIP…', done: 'Pronto: {name}', loaded: '{n} arquivos carregados.',
    notPdf: '{name} não é um PDF.', locked: '{name} é protegido por senha: remova a senha primeiro.', broken: 'Não foi possível ler {name}.',
    'e-syntax': 'Confira os intervalos: "{part}" não é uma página nem um intervalo.', 'e-range': '"{part}" está fora das páginas 1–{n}.', empty: 'Não sobrou nenhuma página.', copied: 'Copiado' },
});

const $ = (id) => document.getElementById(id);
const t = TK.t;
const docs = [];   // { name, bytes }
const pages = [];  // { doc, index, rotate, el }
const status = (msg, kind) => { $('status').hidden = !msg; $('status').textContent = msg || ''; $('status').className = 'tb-note' + (kind ? ' tb-note--' + kind : ''); };
const isPdf = (b) => b.length > 5 && String.fromCharCode(...b.subarray(0, 5)) === '%PDF-';

const grid = sortableGrid($('tiles'), pages, {
  labels: { left: t('left'), right: t('right'), remove: t('remove'), rotate: t('rotate') },
  onRotate: (p) => { p.rotate = (p.rotate + 90) % 360; p.el.querySelector('canvas').style.transform = `rotate(${p.rotate}deg)`; },
  onChange: refresh,
});

function refresh() {
  const n = pages.length;
  $('pages-panel').hidden = $('actions').hidden = n === 0;
  $('count').textContent = t('count', { p: n, f: new Set(pages.map((p) => p.doc)).size });
}

async function addFiles(list) {
  for (const file of [...list]) {
    status(t('reading', { name: file.name }));
    const bytes = new Uint8Array(await file.arrayBuffer());
    if (!isPdf(bytes)) { status(t('notPdf', { name: file.name }), 'bad'); continue; }
    let preview;
    try { preview = await openForPreview(bytes); }
    catch (e) { status(t(/password/i.test(e.name + e.message) ? 'locked' : 'broken', { name: file.name }), 'bad'); continue; }
    const doc = docs.push({ name: file.name, bytes }) - 1;
    for (let i = 0; i < preview.numPages; i++) {
      const el = document.createElement('div');
      el.style.display = 'grid'; el.style.justifyItems = 'center'; el.style.gap = '4px';
      const cap = document.createElement('span');
      cap.className = 'tile-cap';
      cap.textContent = `${file.name.replace(/\.pdf$/i, '')} · ${t('page', { n: i + 1 })}`;
      el.append(await renderThumb(preview, i), cap);
      pages.push({ doc, index: i, rotate: 0, el });
    }
    await preview.loadingTask.destroy(); // frees the worker-side document
    grid.render(); refresh();
  }
  status(t('loaded', { n: docs.length }), 'ok');
  window.__pdfLoaded = (window.__pdfLoaded || 0) + 1;
}

/** A new PDF with the given page items, in order. */
async function build(items) {
  const { PDFDocument, degrees } = await pdfLib();
  const out = await PDFDocument.create();
  const loaded = new Map();
  for (const p of items) {
    if (!loaded.has(p.doc)) loaded.set(p.doc, await PDFDocument.load(docs[p.doc].bytes, { updateMetadata: false }));
    const [copy] = await out.copyPages(loaded.get(p.doc), [p.index]);
    if (p.rotate) copy.setRotation(degrees((copy.getRotation().angle + p.rotate) % 360));
    out.addPage(copy);
  }
  return new Blob([await out.save()], { type: 'application/pdf' });
}

$('merge').addEventListener('click', async () => {
  if (!pages.length) return status(t('empty'), 'bad');
  status(t('building'));
  let name = $('mname').value.trim() || 'merged.pdf';
  if (!/\.pdf$/i.test(name)) name += '.pdf';
  try { TK.download(await build(pages), name); status(t('done', { name }), 'ok'); window.__pdfMerged = (window.__pdfMerged || 0) + 1; }
  catch (e) { status(t('broken', { name: e.message }), 'bad'); }
});

$('split').addEventListener('click', async () => {
  if (!pages.length) return status(t('empty'), 'bad');
  let groups;
  if (document.querySelector('input[name=smode]:checked').value === 'each') groups = pages.map((_, i) => [i]);
  else {
    const r = parseRanges($('ranges').value, pages.length);
    if (r.error) return status(t('e-' + r.error, { part: r.part, n: pages.length }), 'bad');
    groups = r.groups;
  }
  status(t('building'));
  const base = docs[pages[0].doc].name;
  const files = [];
  for (let g = 0; g < groups.length; g++) files.push({ name: partName(base, g + 1), blob: await build(groups[g].map((i) => pages[i])) });
  if (files.length === 1) { TK.download(files[0].blob, files[0].name); return status(t('done', { name: files[0].name }), 'ok'); }
  status(t('zipping'));
  const JSZip = await jsZip();
  const zip = new JSZip();
  files.forEach((f) => zip.file(f.name, f.blob));
  const name = (base.replace(/\.pdf$/i, '') || 'document') + '-split.zip';
  TK.download(await zip.generateAsync({ type: 'blob' }), name);
  status(t('done', { name }), 'ok');
  window.__pdfSplit = (window.__pdfSplit || 0) + 1;
});

document.querySelectorAll('input[name=smode]').forEach((r) => r.addEventListener('change', () => { $('ranges-field').hidden = r.value !== 'ranges' || !r.checked; }));
$('file').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
const drop = $('drop');
drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('is-over'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('is-over'); }));
drop.addEventListener('drop', (e) => addFiles(e.dataTransfer.files));
</script>
