  other: "Senhas fortes sem precisar decorá-las"
aff_password_manager_text:
  other: "Uma senha longa e aleatória só é prática se algo lembrar dela por você. Um gerenciador de senhas como {{ .Name }} guarda cada senha criptografada, preenche em todos os seus aparelhos e avisa sobre senhas reutilizadas ou vazadas."
aff_vpn_title:
  other: "Esconda seu endereço IP dos sites que você visita"
aff_vpn_text:
  other: "{{ .Name }} manda seu tráfego por um túnel criptografado: os sites veem o IP e a localização do servidor VPN em vez dos seus, e seu provedor não vê quais sites você abre. Sozinha, uma VPN não impede o fingerprinting do navegador."
aff_privacy_title:
  other: "Proteja também o resto dos seus dados pessoais"
aff_privacy_text:
  other: "Remover dados escondidos de arquivos é uma parte da privacidade online. {{ .Name }} ajuda com o resto dos seus dados pessoais."
aff_devsec_title:
  other: "Pegue segredos vazados antes de ir para produção"
aff_devsec_text:
  other: "Esta página verifica um trecho por vez, no seu navegador. {{ .Name }} pode monitorar seus repositórios e pipelines continuamente, para que uma chave ou token vazado seja sinalizado antes de chegar à produção."
