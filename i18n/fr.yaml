  other: "Protégez aussi le reste de vos données personnelles"
aff_privacy_text:
  other: "Supprimer les données cachées des fichiers n'est qu'une partie de la confidentialité en ligne. {{ .Name }} vous aide pour le reste de vos données personnelles."
