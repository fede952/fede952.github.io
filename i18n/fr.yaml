  other: "Un long mot de passe aléatoire n'est pratique que si quelque chose s'en souvient à votre place. Un gestionnaire comme {{ .Name }} stocke chaque mot de passe chiffré, le remplit sur tous vos appareils et signale ceux qui sont réutilisés ou compromis."
aff_vpn_title:
  other: "Masquez votre adresse IP aux sites que vous visitez"
aff_vpn_text:
  other: "{{ .Name }} fait passer votre trafic dans un tunnel chiffré : les sites voient l'IP et la position du serveur VPN au lieu des vôtres, et votre fournisseur d'accès ne voit pas quels sites vous ouvrez. Un VPN seul n'empêche pas l'empreinte du navigateur."
