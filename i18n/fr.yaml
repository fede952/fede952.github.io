  other: "Repérez les secrets exposés avant la mise en production"
aff_devsec_text:
  other: "Cette page vérifie un extrait à la fois, dans votre navigateur. {{ .Name }} peut surveiller en continu vos dépôts et pipelines, pour qu'une clé ou un jeton exposé soit signalé avant d'arriver en production."

